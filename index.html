<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>光譜儀 UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="font-family: Arial; background:#111; color:white;">

<h1>光譜儀介面</h1>

<div>
  <h2>連線狀態</h2>
  <p id="status" style="color:lime;">已連線</p>
</div>

<div>
  <h2>控制</h2>
  <button onclick="startMeasurement()">開始測量</button>
  <button onclick="stopMeasurement()">停止測量</button>
</div>

<div>
  <h2>光譜圖</h2>
  <canvas id="chart" width="800" height="400"></canvas>
</div>

<div>
  <h3>分析結果</h3>
  <p id="peak">主峰波長：-- nm ｜ 強度：--</p>
</div>

<script>
  const wavelengths = [];
  let intensities = [];

  for (let i = 400; i <= 700; i += 5) {
    wavelengths.push(i);
    intensities.push(0);
  }

  const ctx = document.getElementById('chart');

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: wavelengths,
      datasets: [{
        label: 'Intensity',
        data: intensities,
        borderColor: 'cyan',
        borderWidth: 2,
        fill: false
      }]
    },
    options: {
      animation: false,
      scales: {
        x: {
          title: {
            display: true,
            text: '波長 (nm)'
          }
        },
        y: {
          title: {
            display: true,
            text: '強度'
          }
        }
      }
    }
  });

  let interval = null;

  function generateData() {
    return wavelengths.map(i => {
      return (
        80 * Math.exp(-((i - 470) ** 2) / 800) +
        120 * Math.exp(-((i - 550) ** 2) / 500) +
        90 * Math.exp(-((i - 620) ** 2) / 900) +
        Math.random() * 10
      );
    });
  }

  function findPeak() {
    let max = -Infinity;
    let index = 0;

    for (let i = 0; i < intensities.length; i++) {
      if (intensities[i] > max) {
        max = intensities[i];
        index = i;
      }
    }

    const peakWavelength = wavelengths[index];

    document.getElementById("peak").innerText =
      `主峰波長：${peakWavelength} nm ｜ 強度：${max.toFixed(2)}`;
  }

  function startMeasurement() {
    if (interval) return;

    interval = setInterval(() => {
      intensities = generateData();
      chart.data.datasets[0].data = intensities;
      chart.update();
      findPeak();
    }, 500);
  }

  function stopMeasurement() {
    clearInterval(interval);
    interval = null;
  }
</script>

</body>
</html>
