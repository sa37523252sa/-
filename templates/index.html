<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>光譜儀 UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: Arial; background:#111; color:white; padding:20px;">

<h1>光譜儀介面</h1>

<div>
  <h2>連線狀態</h2>
  <p id="status" style="color:lime;">已連線</p>
</div>

<div>
  <h2>上傳圖片</h2>
  <input type="file" id="imageInput" accept="image/*">
</div>

<div style="margin-top: 12px;">
  <label>y1：</label>
  <input type="number" id="y1" placeholder="留空自動抓">
  <label>y2：</label>
  <input type="number" id="y2" placeholder="留空自動抓">
</div>

<div style="margin-top: 20px;">
  <button onclick="calibrateMercury()">汞燈校準</button>
  <button onclick="analyzeSpectrum()">分析圖片</button>
</div>

<div style="margin-top: 20px;">
  <h3>校準資訊</h3>
  <pre id="calibrationInfo" style="color:#fff;">尚未校準</pre>
</div>

<div style="margin-top: 20px;">
  <h2>光譜圖</h2>
  <canvas id="chart" width="900" height="400"></canvas>
</div>

<div style="margin-top: 20px;">
  <h3>分析結果</h3>
  <p id="peak">主峰波長：-- nm ｜ 強度：--</p>
</div>

<div style="margin-top: 20px;">
  <h3>所有峰值</h3>
  <pre id="allPeaks" style="color:#7fffd4;"></pre>
</div>

<script>
  // 在頁面載入後，自動注入拍照功能
window.addEventListener('DOMContentLoaded', () => {
    // 1. 建立容器
    const container = document.createElement('div');
    container.style.cssText = "background:#222; padding:15px; margin-bottom:20px; border-radius:8px;";
    
    // 2. 注入攝影機畫面與按鈕
    container.innerHTML = `
        <h2 style="margin-top:0;">即時擷取</h2>
        <video id="video" width="320" height="240" autoplay playsinline style="background:#000;"></video>
        <div style="margin:10px 0;">
            <button id="snapBtn" style="padding:10px 20px; cursor:pointer;">📸 拍照並上傳</button>
        </div>
        <div id="gallery" style="display:flex; gap:10px; overflow-x:auto;"></div>
    `;
    document.body.prepend(container);

    // 3. 綁定攝影機
    const video = document.getElementById('video');
    navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

    // 4. 拍照邏輯
    document.getElementById('snapBtn').onclick = () => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        // 轉 Blob
        canvas.toBlob(blob => {
            // 自動放入歷史紀錄
            const img = document.createElement('img');
            img.src = canvas.toDataURL();
            img.style.cssText = "width:80px; height:60px; cursor:pointer; border:1px solid #444;";
            img.onclick = () => {
                // 若點擊縮圖，將 blob 放入原有的 file input (模擬上傳)
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(new File([blob], "snapshot.jpg", {type: "image/jpeg"}));
                document.getElementById("imageInput").files = dataTransfer.files;
                alert("已將此照片載入至上傳區，請點擊原本的「分析」按鈕");
            };
            document.getElementById('gallery').prepend(img);
        }, 'image/jpeg');
    };
});
  let chart;
  let calibrated = false;

  function createChart(labels = [], data = []) {
    const ctx = document.getElementById("chart").getContext("2d");

    if (chart) {
      chart.destroy();
    }

    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Intensity",
          data: data,
          borderColor: "cyan",
          borderWidth: 2,
          fill: false,
          pointRadius: 0
        }]
      },
      options: {
        animation: false,
        responsive: false,
        scales: {
          x: {
            title: {
              display: true,
              text: "波長 (nm)"
            }
          },
          y: {
            title: {
              display: true,
              text: "強度"
            }
          }
        }
      }
    });
  }

  createChart();

  function getFormData() {
    const file = document.getElementById("imageInput").files[0];
    const y1 = document.getElementById("y1").value;
    const y2 = document.getElementById("y2").value;

    if (!file) {
      alert("請先選擇圖片");
      return null;
    }

    const formData = new FormData();
    formData.append("image", file);

    if (y1 !== "") formData.append("y1", y1);
    if (y2 !== "") formData.append("y2", y2);

    return formData;
  }

  function updateChartFromSpectrum(spectrum) {
    const labels = spectrum.map(p => p.wavelength);
    const data = spectrum.map(p => p.intensity);
    createChart(labels, data);
  }

  async function calibrateMercury() {
    const formData = getFormData();
    if (!formData) return;

    const res = await fetch("/calibrate", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.error) {
      alert(data.error);
      return;
    }

    calibrated = true;
    updateChartFromSpectrum(data.spectrum);

    document.getElementById("calibrationInfo").innerText =
`校準完成
自動/實際使用範圍: y1=${data.used_y1}, y2=${data.used_y2}
係數: ${data.coefficients.join(", ")}
峰值 pixel: ${data.detected_peak_pixels.join(", ")}
對應汞燈線: ${data.matched_mercury_lines.join(", ")}
校正後峰值: ${data.calibrated_peak_wavelengths.join(", ")}`;

    document.getElementById("peak").innerText =
      "校準完成，可開始分析未知圖片";
    document.getElementById("allPeaks").innerText = "";
  }

  async function analyzeSpectrum() {
    if (!calibrated) {
      alert("請先做汞燈校準");
      return;
    }

    const formData = getFormData();
    if (!formData) return;

    const res = await fetch("/analyze", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.error) {
      alert(data.error);
      return;
    }

    updateChartFromSpectrum(data.spectrum);

    document.getElementById("peak").innerText =
      `主峰波長：${data.peak_wavelength} nm ｜ 強度：${data.peak_intensity} ｜ 使用範圍 y=${data.used_y1}~${data.used_y2}`;

    if (data.all_peaks && data.all_peaks.length > 0) {
      document.getElementById("allPeaks").innerText =
        data.all_peaks.map(p =>
          `x=${p.x}, λ=${p.wavelength} nm, intensity=${p.intensity}`
        ).join("\n");
    } else {
      document.getElementById("allPeaks").innerText = "沒有偵測到其他峰值";
    }
  }
</script>

</body>
</html>
