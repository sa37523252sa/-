<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>光譜儀 UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="font-family: Arial; background:#111; color:white; padding:20px;">

<h1>光譜儀介面</h1>

<div>
  <h2>連線狀態</h2>
  <p id="status" style="color:lime;">已連線</p>
</div>

<div>
  <h2>圖片上傳</h2>
  <input type="file" id="imageInput" accept="image/*">
</div>

<div style="margin-top: 20px;">
  <h2>控制</h2>
  <button onclick="calibrateMercury()">汞燈校準</button>
  <button onclick="measureSpectrum()">開始測量</button>
  <button onclick="stopMeasurement()">停止測量</button>
</div>

<div style="margin-top: 20px;">
  <h2>校準資訊</h2>
  <p id="calibration">尚未校準</p>
</div>

<div style="margin-top: 20px;">
  <h2>光譜圖</h2>
  <canvas id="chart" width="900" height="400"></canvas>
</div>

<div style="margin-top: 20px;">
  <h3>分析結果</h3>
  <p id="peak">主峰波長：-- nm ｜ 強度：--</p>
</div>

<script>
  let wavelengths = [];
  let intensities = [];
  let interval = null;
  let calibrationReady = false;

  const ctx = document.getElementById('chart');

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: wavelengths,
      datasets: [{
        label: 'Intensity',
        data: intensities,
        borderColor: 'cyan',
        borderWidth: 2,
        fill: false
      }]
    },
    options: {
      animation: false,
      responsive: false,
      scales: {
        x: {
          title: {
            display: true,
            text: '波長 (nm)'
          }
        },
        y: {
          title: {
            display: true,
            text: '強度'
          }
        }
      }
    }
  });

  function updateChart(spectrum) {
    wavelengths = spectrum.map(p => p.wavelength);
    intensities = spectrum.map(p => p.intensity);

    chart.data.labels = wavelengths;
    chart.data.datasets[0].data = intensities;
    chart.update();
  }

  async function calibrateMercury() {
    const file = document.getElementById("imageInput").files[0];
    if (!file) {
      alert("請先上傳汞燈圖片");
      return;
    }

    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch("/calibrate", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.error) {
      alert(data.error);
      return;
    }

    calibrationReady = true;
    document.getElementById("calibration").innerText =
      `校準完成：λ = ${data.coefficients.join(" , ")}`;

    updateChart(data.spectrum);

    document.getElementById("peak").innerText =
      `校準峰示例：${data.detected_peaks_nm.join(", ")} nm`;
  }

  async function measureSpectrum() {
    if (!calibrationReady) {
      alert("請先用汞燈校準");
      return;
    }

    const file = document.getElementById("imageInput").files[0];
    if (!file) {
      alert("請先上傳要分析的圖片");
      return;
    }

    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch("/analyze", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.error) {
      alert(data.error);
      return;
    }

    updateChart(data.spectrum);

    document.getElementById("peak").innerText =
      `主峰波長：${data.peak_wavelength.toFixed(2)} nm ｜ 強度：${data.peak_intensity.toFixed(2)}`;
  }

  function stopMeasurement() {
    if (interval) {
      clearInterval(interval);
      interval = null;
    }
  }
</script>

</body>
</html>
