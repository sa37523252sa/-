<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>光譜儀 UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; background:#111; color:white; padding:20px; }
    #calibrationInfo { color:#fff; background:#222; padding:10px; height:120px; overflow-y:auto; border:1px solid #444; }
    #historyList { margin-top: 20px; border-top: 1px solid #444; padding-top: 10px; }
    .history-item { display: block; margin: 5px; cursor: pointer; background: #333; color: white; padding: 5px; border-radius: 4px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { color:#bbb; font-size:14px; }

    /* 裁剪視窗 */
    #cropModal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.88);
      z-index:9999;
      padding:20px;
      overflow:auto;
    }
    #cropBox {
      background:#1b1b1b;
      border:1px solid #555;
      border-radius:8px;
      padding:15px;
      max-width:1050px;
      margin:auto;
    }
    #cropCanvas {
      max-width:100%;
      background:#000;
      border:1px solid #555;
      cursor:crosshair;
      touch-action:none;
      display:block;
    }
  </style>
</head>
<body>

<h1>光譜儀介面</h1>

<div id="captureContainer" style="background:#222; padding:15px; margin-bottom:20px; border-radius:8px;">
    <h2>即時擷取</h2>
    <video id="video" width="320" height="240" autoplay playsinline style="background:#000;"></video>
    <div style="margin:10px 0;"><button id="snapBtn">📸 拍照並記錄</button></div>
    <div id="gallery" style="display:flex; gap:10px; overflow-x:auto;"></div>
</div>

<div>
  <h2>上傳圖片</h2>
  <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/*">
  <button type="button" id="editBtn">✂️ 編輯/裁剪圖片</button>
  <span id="cropStatus" class="hint"></span>
</div>

<!-- 裁剪視窗 -->
<div id="cropModal">
  <div id="cropBox">
    <h2>裁剪圖片</h2>
    <p class="hint">拖曳選取要保留的光譜區域，放開後按「套用裁剪」。</p>
    <canvas id="cropCanvas"></canvas>
    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" id="applyCropBtn">✅ 套用裁剪</button>
      <button type="button" id="resetCropBtn">重新選取</button>
      <button type="button" id="closeCropBtn">取消</button>
    </div>
    <p id="cropInfo" class="hint">尚未選取範圍</p>
  </div>
</div>

<div style="margin-top: 12px;">
  <label>y1：</label> <input type="number" id="y1" placeholder="自動抓">
  <label>y2：</label> <input type="number" id="y2" placeholder="自動抓">
</div>

<div style="margin-top: 20px;">
  <button id="calBtn" onclick="calibrateMercury()">汞燈校準</button>
  <button id="anaBtn" onclick="analyzeSpectrum()">分析圖片</button>
</div>

<div style="margin-top: 20px;">
  <h3>校準資訊</h3>
  <pre id="calibrationInfo">尚未校準</pre>
</div>

<div style="margin-top: 20px;">
  <h2>光譜圖</h2>
  <canvas id="chart" width="900" height="400"></canvas>
</div>

<div style="margin-top: 20px;">
  <h3>分析結果</h3>
  <p id="peak">主峰波長：-- nm</p>
</div>

<div id="historyList">
    <h3>分析歷史紀錄</h3>
</div>

<script>
  let chart;
  let calibrated = false;
  let analysisHistory = [];

  // ===== 裁剪用變數 =====
  let cropImage = new Image();
  let cropOriginalFileName = "cropped.jpg";
  let cropScale = 1;
  let cropStart = null;
  let cropRect = null;
  let isDraggingCrop = false;

  window.addEventListener('DOMContentLoaded', () => {
    // 初始化攝影機
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(s => document.getElementById('video').srcObject = s)
        .catch(() => console.log("無法開啟攝影機，仍可上傳圖片"));
    }

    document.getElementById('snapBtn').onclick = takeSnapshot;
    document.getElementById('editBtn').onclick = openCropEditor;
    document.getElementById('applyCropBtn').onclick = applyCrop;
    document.getElementById('resetCropBtn').onclick = resetCropSelection;
    document.getElementById('closeCropBtn').onclick = closeCropEditor;

    const cropCanvas = document.getElementById("cropCanvas");
    cropCanvas.addEventListener("pointerdown", startCrop);
    cropCanvas.addEventListener("pointermove", moveCrop);
    cropCanvas.addEventListener("pointerup", endCrop);
    cropCanvas.addEventListener("pointerleave", endCrop);

    document.getElementById('imageInput').addEventListener('change', () => {
      document.getElementById('cropStatus').innerText = '';
    });
  });

  function takeSnapshot() {
    const video = document.getElementById('video');
    if (!video.videoWidth || !video.videoHeight) return alert("攝影機尚未準備好");

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    canvas.toBlob(blob => {
      setFileInputFromBlob(blob, "snapshot.jpg", "image/jpeg");

      const img = document.createElement('img');
      img.src = canvas.toDataURL('image/jpeg');
      img.style.cssText = "width:80px; height:60px; cursor:pointer; border:1px solid #444; object-fit:cover;";
      img.onclick = () => {
        setFileInputFromBlob(blob, "snapshot.jpg", "image/jpeg");
        alert("已載入截圖");
      };
      document.getElementById('gallery').prepend(img);
      document.getElementById('cropStatus').innerText = "已拍照，可按編輯/裁剪圖片";
    }, 'image/jpeg', 0.95);
  }

  function setFileInputFromBlob(blob, filename, type) {
    const file = new File([blob], filename, { type });
    const dt = new DataTransfer();
    dt.items.add(file);
    document.getElementById("imageInput").files = dt.files;
  }

  function openCropEditor() {
    const file = document.getElementById("imageInput").files[0];
    if (!file) return alert("請先上傳或拍攝一張圖片");

    // 注意：瀏覽器通常不能直接讀 HEIC，建議用 JPG/PNG
    if (file.type && file.type.includes("heic")) {
      return alert("HEIC 圖片瀏覽器可能無法裁剪，請先轉成 JPG 或 PNG");
    }

    cropOriginalFileName = file.name || "image.jpg";
    cropRect = null;
    cropStart = null;
    document.getElementById("cropInfo").innerText = "圖片讀取中...";

    const reader = new FileReader();
    reader.onload = e => {
      cropImage = new Image();
      cropImage.onload = () => {
        document.getElementById("cropModal").style.display = "block";
        drawCropCanvas();
        document.getElementById("cropInfo").innerText = "尚未選取範圍";
      };
      cropImage.onerror = () => {
        alert("圖片無法載入。請確認格式是 JPG、PNG 或 WebP，不要用 HEIC。");
      };
      cropImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function closeCropEditor() {
    document.getElementById("cropModal").style.display = "none";
  }

  function drawCropCanvas() {
    const canvas = document.getElementById("cropCanvas");
    const ctx = canvas.getContext("2d");
    const maxW = 980;
    cropScale = Math.min(1, maxW / cropImage.naturalWidth);
    canvas.width = Math.round(cropImage.naturalWidth * cropScale);
    canvas.height = Math.round(cropImage.naturalHeight * cropScale);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(cropImage, 0, 0, canvas.width, canvas.height);

    if (cropRect) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.clearRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      ctx.strokeStyle = "cyan";
      ctx.lineWidth = 2;
      ctx.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      ctx.restore();
    }
  }

  function getCanvasPoint(e) {
    const canvas = document.getElementById("cropCanvas");
    const rect = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(canvas.width, e.clientX - rect.left)),
      y: Math.max(0, Math.min(canvas.height, e.clientY - rect.top))
    };
  }

  function startCrop(e) {
    e.preventDefault();
    isDraggingCrop = true;
    cropStart = getCanvasPoint(e);
    cropRect = { x: cropStart.x, y: cropStart.y, w: 0, h: 0 };
  }

  function moveCrop(e) {
    if (!isDraggingCrop || !cropStart) return;
    e.preventDefault();
    const p = getCanvasPoint(e);
    cropRect = {
      x: Math.min(cropStart.x, p.x),
      y: Math.min(cropStart.y, p.y),
      w: Math.abs(p.x - cropStart.x),
      h: Math.abs(p.y - cropStart.y)
    };
    drawCropCanvas();
  }

  function endCrop() {
    if (!isDraggingCrop) return;
    isDraggingCrop = false;
    if (cropRect && cropRect.w > 5 && cropRect.h > 5) {
      const realW = Math.round(cropRect.w / cropScale);
      const realH = Math.round(cropRect.h / cropScale);
      document.getElementById("cropInfo").innerText = `已選取：${realW} × ${realH} px`;
    }
  }

  function resetCropSelection() {
    cropRect = null;
    drawCropCanvas();
    document.getElementById("cropInfo").innerText = "尚未選取範圍";
  }

  function applyCrop() {
    if (!cropRect || cropRect.w < 5 || cropRect.h < 5) {
      return alert("請先拖曳選取裁剪範圍");
    }

    const sx = Math.round(cropRect.x / cropScale);
    const sy = Math.round(cropRect.y / cropScale);
    const sw = Math.round(cropRect.w / cropScale);
    const sh = Math.round(cropRect.h / cropScale);

    const out = document.createElement("canvas");
    out.width = sw;
    out.height = sh;
    out.getContext("2d").drawImage(cropImage, sx, sy, sw, sh, 0, 0, sw, sh);

    out.toBlob(blob => {
      setFileInputFromBlob(blob, "cropped_" + cropOriginalFileName.replace(/\.[^.]+$/, ".jpg"), "image/jpeg");
      document.getElementById("cropStatus").innerText = `已裁剪：${sw} × ${sh} px，可直接校準/分析`;
      closeCropEditor();
    }, "image/jpeg", 0.95);
  }

  function createChart(labels, data) {
    if (chart) chart.destroy();
    const ctx = document.getElementById("chart").getContext("2d");
    chart = new Chart(ctx, {
      type: "line",
      data: { labels, datasets: [{ label: "Intensity", data, borderColor: "cyan", borderWidth: 2, fill: false, pointRadius: 0 }] },
      options: { animation: false, responsive: false }
    });
  }

  async function callApi(endpoint, formData) {
    const btn = endpoint === '/calibrate' ? document.getElementById('calBtn') : document.getElementById('anaBtn');
    btn.disabled = true;
    try {
      const res = await fetch(endpoint, { method: "POST", body: formData });
      return await res.json();
    } finally {
      btn.disabled = false;
    }
  }

  async function calibrateMercury() {
    const fd = new FormData();
    const file = document.getElementById("imageInput").files[0];
    if (!file) return alert("請選擇圖片");
    fd.append("image", file);

    const data = await callApi("/calibrate", fd);
    if (data.error) return alert(data.error);

    calibrated = true;
    createChart(data.spectrum.map(p => p.wavelength), data.spectrum.map(p => p.intensity));
    document.getElementById("calibrationInfo").innerText = `校準成功\n係數: ${data.coefficients.join(", ")}`;
  }

  async function analyzeSpectrum() {
    if (!calibrated) return alert("請先校準");
    const fd = new FormData();
    const file = document.getElementById("imageInput").files[0];
    if (!file) return alert("請先選擇圖片");
    fd.append("image", file);

    const data = await callApi("/analyze", fd);
    if (data.error) return alert(data.error);

    createChart(data.spectrum.map(p => p.wavelength), data.spectrum.map(p => p.intensity));
    document.getElementById("peak").innerText = `主峰波長：${data.peak_wavelength} nm`;

    const record = {
      time: new Date().toLocaleTimeString(),
      result: data.peak_wavelength,
      spectrum: data.spectrum
    };
    analysisHistory.push(record);

    const listDiv = document.getElementById("historyList");
    const btn = document.createElement("button");
    btn.className = "history-item";
    btn.innerText = `紀錄 ${analysisHistory.length}: ${record.result} nm (${record.time})`;
    btn.onclick = () => {
      createChart(record.spectrum.map(p => p.wavelength), record.spectrum.map(p => p.intensity));
      document.getElementById("peak").innerText = `回看結果：${record.result} nm`;
    };
    listDiv.appendChild(btn);
  }
</script>
</body>
</html>
