<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>光譜儀 UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; background:#111; color:white; padding:20px; }
    #calibrationInfo { color:#fff; background:#222; padding:10px; height:120px; overflow-y:auto; border:1px solid #444; }
    #historyList { margin-top: 20px; border-top: 1px solid #444; padding-top: 10px; }
    .history-item { display: block; margin: 5px; cursor: pointer; background: #333; color: white; padding: 5px; border-radius: 4px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<h1>光譜儀介面</h1>

<div id="captureContainer" style="background:#222; padding:15px; margin-bottom:20px; border-radius:8px;">
    <h2>即時擷取</h2>
    <video id="video" width="320" height="240" autoplay playsinline style="background:#000;"></video>
    <div style="margin:10px 0;"><button id="snapBtn">📸 拍照並記錄</button></div>
    <div id="gallery" style="display:flex; gap:10px; overflow-x:auto;"></div>
</div>

<div>
  <h2>上傳圖片</h2>
  <input type="file" id="imageInput" accept="image/*">
</div>

<div style="margin-top: 12px;">
  <label>y1：</label> <input type="number" id="y1" placeholder="自動抓">
  <label>y2：</label> <input type="number" id="y2" placeholder="自動抓">
</div>

<div style="margin-top: 20px;">
  <button id="calBtn" onclick="calibrateMercury()">汞燈校準</button>
  <button id="anaBtn" onclick="analyzeSpectrum()">分析圖片</button>
</div>

<div style="margin-top: 20px;">
  <h3>校準資訊</h3>
  <pre id="calibrationInfo">尚未校準</pre>
</div>

<div style="margin-top: 20px;">
  <h2>光譜圖</h2>
  <canvas id="chart" width="900" height="400"></canvas>
</div>

<div style="margin-top: 20px;">
  <h3>分析結果</h3>
  <p id="peak">主峰波長：-- nm</p>
</div>

<div id="historyList">
    <h3>分析歷史紀錄</h3>
</div>

<script>
  let chart;
  let calibrated = false;
  let analysisHistory = []; 

  // 初始化攝影機
  window.addEventListener('DOMContentLoaded', () => {
    navigator.mediaDevices.getUserMedia({ video: true }).then(s => document.getElementById('video').srcObject = s);
    
    document.getElementById('snapBtn').onclick = () => {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(blob => {
            const img = document.createElement('img');
            img.src = canvas.toDataURL();
            img.style.cssText = "width:80px; height:60px; cursor:pointer; border:1px solid #444;";
            
            img.onclick = () => {
                const dt = new DataTransfer();
                dt.items.add(new File([blob], "snapshot.jpg", {type: "image/jpeg"}));
                document.getElementById("imageInput").files = dt.files;
                alert("已載入截圖");
            };
            document.getElementById('gallery').prepend(img);
        }, 'image/jpeg');
    };
  });

  function createChart(labels, data) {
    if (chart) chart.destroy();
    const ctx = document.getElementById("chart").getContext("2d");
    chart = new Chart(ctx, {
      type: "line",
      data: { labels, datasets: [{ label: "Intensity", data, borderColor: "cyan", borderWidth: 2, fill: false, pointRadius: 0 }] },
      options: { animation: false, responsive: false }
    });
  }

  async function callApi(endpoint, formData) {
    const btn = endpoint === '/calibrate' ? document.getElementById('calBtn') : document.getElementById('anaBtn');
    btn.disabled = true;
    try {
      const res = await fetch(endpoint, { method: "POST", body: formData });
      return await res.json();
    } finally {
      btn.disabled = false;
    }
  }

  async function calibrateMercury() {
    const fd = new FormData();
    const file = document.getElementById("imageInput").files[0];
    if (!file) return alert("請選擇圖片");
    fd.append("image", file);
    
    const data = await callApi("/calibrate", fd);
    if (data.error) return alert(data.error);
    
    calibrated = true;
    createChart(data.spectrum.map(p => p.wavelength), data.spectrum.map(p => p.intensity));
    document.getElementById("calibrationInfo").innerText = `校準成功\n係數: ${data.coefficients.join(", ")}`;
  }

  async function analyzeSpectrum() {
    if (!calibrated) return alert("請先校準");
    const fd = new FormData();
    const file = document.getElementById("imageInput").files[0];
    if (!file) return alert("請先選擇圖片");
    fd.append("image", file);
    
    const data = await callApi("/analyze", fd);
    if (data.error) return alert(data.error);
    
    // 更新圖表與顯示
    createChart(data.spectrum.map(p => p.wavelength), data.spectrum.map(p => p.intensity));
    document.getElementById("peak").innerText = `主峰波長：${data.peak_wavelength} nm`;
    
    // 將結果存入歷史陣列
    const record = {
        time: new Date().toLocaleTimeString(),
        result: data.peak_wavelength,
        spectrum: data.spectrum
    };
    analysisHistory.push(record);
    
    // 更新 UI 列表
    const listDiv = document.getElementById("historyList");
    const btn = document.createElement("button");
    btn.className = "history-item";
    btn.innerText = `紀錄 ${analysisHistory.length}: ${record.result} nm (${record.time})`;
    btn.onclick = () => {
        createChart(record.spectrum.map(p => p.wavelength), record.spectrum.map(p => p.intensity));
        document.getElementById("peak").innerText = `回看結果：${record.result} nm`;
    };
    listDiv.appendChild(btn);
  }
</script>
</body>
</html>
