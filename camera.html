<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>光譜儀比較系統</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .main-box { border: 2px solid #00e676; background: #000; display: inline-block; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        video { display: block; max-width: 100%; height: auto; background: #222; width: 640px; }
        
        .controls { margin-bottom: 30px; }
        button { 
            background: #ff4757; color: white; border: none; padding: 15px 40px; 
            font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); transition: 0.3s;
        }
        button:hover { background: #ff6b81; transform: scale(1.05); }

        /* 比較區域樣式 */
        #gallery { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
            padding: 20px; border-top: 1px solid #444; 
        }
        .history-item { 
            background: #333; padding: 10px; border-radius: 8px; width: 200px; 
            transition: 0.2s; cursor: pointer;
        }
        .history-item:hover { background: #444; border: 1px solid #00e676; }
        .history-item img { width: 100%; border-radius: 4px; display: block; }
        .history-item span { font-size: 12px; color: #aaa; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>📸 即時光譜擷取與比較</h1>

    <div class="main-box">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="snap">📸 拍照並記錄</button>
        <p id="status" style="color: #00e676;">系統就緒</p>
    </div>

    <h3>歷史記錄（點擊可查看大圖）</h3>
    <div id="gallery">
        </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const snap = document.getElementById('snap');
        const canvas = document.getElementById('canvas');
        const gallery = document.getElementById('gallery');
        const status = document.getElementById('status');

        // 啟動相機
        navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { 
            status.innerText = "相機啟動失敗"; 
            status.style.color = "red";
        });

        snap.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            const timeLabel = new Date().toLocaleTimeString();

            // 1. 自動下載
            const link = document.createElement('a');
            link.download = `Spectrum_${new Date().getTime()}.jpg`;
            link.href = dataUrl;
            link.click();

            // 2. 顯示在下方比較區
            addThumbnail(dataUrl, timeLabel);
            
            status.innerText = "已記錄於 " + timeLabel;
        });

        function addThumbnail(src, time) {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <img src="${src}">
                <span>時間: ${time}</span>
            `;
            
            // 點擊縮圖可以下載或放大檢視
            div.onclick = () => {
                const newTab = window.open();
                newTab.document.write(`<img src="${src}" style="max-width:100%;">`);
            };

            // 最新的照片排在最前面
            gallery.insertBefore(div, gallery.firstChild);
        }
    </script>
</body>
</html>
