<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>光譜儀控制台</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 30px; }
    .container { max-width: 900px; margin: auto; }
    
    /* 相機與按鈕區域 */
    .capture-section { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 30px; }
    video { width: 320px; height: 180px; background: #000; border-radius: 4px; }
    button { padding: 10px 20px; background: #222; border: 1px solid #444; color: #fff; cursor: pointer; }
    button:hover { border-color: #00f2ff; }
    
    /* 歷史紀錄區域 */
    .history { display: flex; gap: 10px; overflow-x: auto; padding: 10px; background: #1a1a1a; border-radius: 4px; }
    .history img { width: 100px; height: 60px; object-fit: cover; cursor: pointer; border: 1px solid #333; }
  </style>
</head>
<body>

<div class="container">
  <h1>光譜儀控制台</h1>

  <div class="capture-section">
    <div>
      <video id="video" autoplay playsinline></video>
      <div style="margin-top:10px;">
        <button onclick="takeAndAnalyze()">📸 拍照並分析</button>
      </div>
    </div>
    <div style="flex-grow: 1;">
      <p>歷史紀錄 (點擊重新分析)</p>
      <div class="history" id="gallery"></div>
    </div>
  </div>

  <input type="number" id="y1" placeholder="y1">
  <input type="number" id="y2" placeholder="y2">
  <button onclick="calibrateMercury()">汞燈校準</button>

  <canvas id="chart" width="800" height="300"></canvas>
  <p id="peak">主峰波長：--</p>
  <pre id="calibrationInfo">尚未校準</pre>
</div>

<canvas id="snapshotCanvas" style="display:none;"></canvas>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('snapshotCanvas');
  const gallery = document.getElementById('gallery');

  // 1. 初始化相機
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => { video.srcObject = stream; });

  // 2. 拍照並上傳至 Python 後端
  async function takeAndAnalyze() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    // 將影像存入歷史區
    const dataUrl = canvas.toDataURL('image/jpeg');
    const img = document.createElement('img');
    img.src = dataUrl;
    img.onclick = () => alert("可在此處加入重新觸發分析的邏輯");
    gallery.prepend(img);

    // 上傳至 Python
    canvas.toBlob(async (blob) => {
      const formData = new FormData();
      formData.append("image", blob, "capture.jpg");
      formData.append("y1", document.getElementById("y1").value);
      formData.append("y2", document.getElementById("y2").value);

      const res = await fetch("/process_capture", { method: "POST", body: formData });
      const data = await res.json();
      updateChartFromSpectrum(data.spectrum);
    });
  }

  // [請保留你原本的 updateChartFromSpectrum, calibrateMercury 等函式]
</script>
</body>
</html>
